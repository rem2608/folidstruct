name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson desktop-file-utils appstream \
            python3-gi gir1.2-gtk-4.0 gir1.2-adw-1

      - name: Check versions
        run: scripts/check-version.sh

      - name: Build and test
        run: |
          meson setup build
          meson test -C build --print-errorlogs

      - name: Test install
        run: |
          DESTDIR="$PWD/staging" meson install -C build
          find staging -type f | sort

      - name: Import modules
        run: |
          python3 -c "import sys; sys.path.insert(0, '.'); \
            import folidstruct.manager, folidstruct.newproject; print('ok')"
