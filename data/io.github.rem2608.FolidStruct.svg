  <!-- Folder -->
  <path d="M24 40a6 6 0 0 1 6-6h18l7 7h43a6 6 0 0 1 6 6v8H24z" fill="#99c1f1"/>
  <rect x="24" y="46" width="80" height="52" rx="6" fill="#fff"/>
