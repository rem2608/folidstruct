    <g fill="none" stroke="#1a5fb4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M42 34V22"/>
      <path d="M70 41V26l8-8V0"/>
      <path d="M92 41V30l8-8"/>
      <path d="M24 60H0"/>
      <path d="M24 80H14"/>
      <path d="M104 64h24"/>
      <path d="M104 82h10"/>
      <path d="M40 98v8l-6 6v16"/>
      <path d="M64 98v12"/>
      <path d="M88 98v6l6 6v18"/>
    </g>
    <g fill="#1a5fb4">
      <circle cx="42" cy="22" r="3.5"/>
      <circle cx="100" cy="22" r="3.5"/>
      <circle cx="14" cy="80" r="3.5"/>
      <circle cx="114" cy="82" r="3.5"/>
      <circle cx="64" cy="110" r="3.5"/>
    </g>
  </g>

